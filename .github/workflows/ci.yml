name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Тесты сервера (PostgreSQL)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ryadom
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DJANGO_SETTINGS_MODULE: config.settings.test
      POSTGRES_HOST: localhost
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ryadom
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Установка зависимостей
        run: pip install -r requirements-dev.txt
      - name: Линтер
        run: |
          mkdir -p ../reports
          set -o pipefail
          ruff check . --output-format=concise 2>&1 | tee ../reports/ruff.txt
      - name: Миграции согласованы с моделями
        run: |
          mkdir -p ../reports
          set -o pipefail
          python manage.py makemigrations --check --dry-run 2>&1 | tee ../reports/migrations.txt
      - name: Версии зависимостей (для будущей фиксации)
        run: |
          mkdir -p ../reports
          pip freeze | sort > ../reports/requirements.lock.txt
          {
            echo "<details><summary>Версии зависимостей</summary>"
            echo
            echo '```'
            cat ../reports/requirements.lock.txt
            echo '```'
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Тесты
        run: |
          mkdir -p ../reports
          pytest --junitxml=../reports/junit.xml --cov --cov-report=xml:../reports/coverage.xml --cov-report=term
      - name: Сводка результатов
        if: always()
        run: python ../tools/ci_summary.py ../reports/junit.xml ../reports/REPORT.md
      - name: Отчёты (junit, покрытие, сводка)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: reports/
          if-no-files-found: warn

  project-checks:
    name: Проверки проекта и безопасность
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Структура, версия, справочник, секреты, быстрые тесты
        run: python tools/local_check.py
      - name: Установка зависимостей
        run: pip install -r backend/requirements-dev.txt
      - name: Известные уязвимости зависимостей
        run: pip-audit -r backend/requirements.txt
      - name: Проверка боевых настроек (check --deploy)
        working-directory: backend
        env:
          DJANGO_SETTINGS_MODULE: config.settings.prod
          DJANGO_SECRET_KEY: ci-only-secret-key-for-deploy-check-0123456789-abcdefghij-xyz  # secret-scan: allow
          DJANGO_ALLOWED_HOSTS: example.test
          EMAIL_HOST: smtp.example.test
          FIELD_ENCRYPTION_KEYS: MDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDA=  # secret-scan: allow
        run: python manage.py check --deploy --tag security --fail-level WARNING
      - name: Скрипты развёртывания (shellcheck)
        run: shellcheck -S warning deploy/*.sh deploy/backup/*.sh
      - name: Схема развёртывания (docker compose config)
        working-directory: deploy
        run: |
          cp .env.prod.example .env.prod
          docker compose --env-file .env.prod -f docker-compose.prod.yml config --quiet
      - name: Отчёт проверок
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: project-checks
          path: reports/
          if-no-files-found: ignore

  docker:
    name: Сборка образа сервера
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Сборка Docker-образа
        run: docker build -t ryadom-backend:ci ./backend
      - name: Сборка образа резервного копирования
        run: docker build -t ryadom-backup:ci ./deploy/backup

  client:
    name: Клиент (Expo, TypeScript)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      EXPO_NO_TELEMETRY: "1"
      CI: "1"
    defaults:
      run:
        shell: bash
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Копирование изображений
        working-directory: .
        run: node client/scripts/sync-assets.mjs
      - name: Установка зависимостей
        run: |
          set -o pipefail
          mkdir -p ../reports
          npm install --no-audit --no-fund 2>&1 | tee ../reports/npm-install.txt
      - name: Проверка типов
        run: |
          set -o pipefail
          mkdir -p ../reports
          npx tsc --noEmit 2>&1 | tee ../reports/tsc.txt
      - name: Тесты
        env:
          JEST_JUNIT_OUTPUT_DIR: ../reports
          JEST_JUNIT_OUTPUT_NAME: client-junit.xml
        run: npx jest --ci --reporters=default --reporters=jest-junit
      - name: Сборка веб-версии
        run: |
          set -o pipefail
          npx expo export --platform web 2>&1 | tee ../reports/expo-export.txt
      - name: Сводка результатов
        if: always()
        working-directory: .
        run: python tools/ci_summary.py reports/client-junit.xml reports/CLIENT_REPORT.md
      - name: Отчёты и файл блокировки версий
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: client-reports
          path: |
            reports/
            client/package-lock.json
          if-no-files-found: warn

  e2e:
    name: Сквозной сценарий (браузер)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ryadom
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DJANGO_SETTINGS_MODULE: config.settings.dev
      POSTGRES_HOST: localhost
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ryadom
      EMAIL_BACKEND: django.core.mail.backends.filebased.EmailBackend
      EMAIL_FILE_PATH: /tmp/ryadom-mail
      EXPO_NO_TELEMETRY: "1"
      CI: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Зависимости сервера
        run: pip install -r backend/requirements-dev.txt
      - name: 'База: миграции, справочник, роли, демо-приглашения'
        working-directory: backend
        run: |
          mkdir -p ../reports
          python manage.py migrate --noinput
          python manage.py load_communities
          python manage.py setup_roles
          python manage.py seed_demo --out /tmp/ryadom-invites.json
      - name: Запуск сервера
        working-directory: backend
        run: |
          nohup python manage.py runserver 127.0.0.1:8000 --noreload > ../reports/backend.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8000/api/v1/health/ && break; sleep 2; done
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Копирование изображений
        run: node client/scripts/sync-assets.mjs
      - name: Сборка веба
        working-directory: client
        env:
          EXPO_PUBLIC_API_URL: http://127.0.0.1:8000
        run: |
          npm ci
          npx expo export --platform web
      - name: Запуск веба
        run: |
          nohup npx --yes serve@14 -s client/dist -l 8081 > reports/web.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:8081/welcome > /dev/null && break; sleep 2; done
      - name: Сценарии браузера
        working-directory: client/e2e
        env:
          E2E_INVITES_FILE: /tmp/ryadom-invites.json
          E2E_BASE_URL: http://localhost:8081
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
          npx playwright test
      - name: Отчёты (браузер, журнал сервера)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-reports
          path: |
            reports/
          if-no-files-found: warn
