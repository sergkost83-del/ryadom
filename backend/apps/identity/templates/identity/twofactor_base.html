<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>РЯДОМ — {% block title %}{% endblock %}</title>
<style>
  body { margin: 0; background: #fffaf7; color: #11192c; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif; }
  main { max-width: 440px; margin: 40px auto; padding: 0 16px; }
  h1 { color: #ff5b45; margin: 0 0 8px; }
  .card { background: #fff; border: 1px solid #dce2e8; border-radius: 18px; padding: 20px; }
  input[type=text] { width: 100%; box-sizing: border-box; font-size: 22px; padding: 12px; border: 1px solid #dce2e8; border-radius: 14px; letter-spacing: 3px; }
  button { margin-top: 12px; width: 100%; padding: 14px; border: 0; border-radius: 14px; background: #ff5b45; color: #fff; font-size: 16px; cursor: pointer; }
  .error { color: #b3261e; margin: 8px 0; }
  .muted { color: #68758d; font-size: 14px; }
  code { background: #edf0f4; padding: 2px 6px; border-radius: 6px; word-break: break-all; }
  ul.codes { list-style: none; padding: 0; columns: 2; font-family: monospace; font-size: 18px; }
</style>
</head>
<body><main><h1>РЯДОМ</h1><div class="card">{% block content %}{% endblock %}</div></main></body>
</html>
